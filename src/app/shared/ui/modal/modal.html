@if (modalService.isOpen$ | async) {
  <div class="modal-shell">
    <button
      class="modal-backdrop"
      type="button"
      aria-label="Cerrar modal"
      (click)="close()"
    ></button>

    <section
      class="modal-panel"
      role="dialog"
      aria-modal="true"
    >
      <button
        class="modal-close-button"
        type="button"
        aria-label="Cerrar"
        (click)="close()"
      >
        x
      </button>

      <ng-content />
    </section>
  </div>
}
