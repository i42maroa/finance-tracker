@if (modalService.isOpen$ | async) {
  <div class="fixed inset-0 z-40 flex items-end justify-center sm:items-center">
    <button
      class="absolute inset-0 h-full w-full bg-slate-950/45"
      type="button"
      aria-label="Cerrar modal"
      (click)="close()"
    ></button>

    <section
      class="relative z-10 max-h-[92vh] w-full overflow-y-auto rounded-t-lg bg-white p-4 shadow-2xl sm:max-w-xl sm:rounded-lg sm:p-5"
      role="dialog"
      aria-modal="true"
    >
      <button
        class="absolute right-3 top-3 flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-white text-xl font-semibold text-slate-600 shadow-sm"
        type="button"
        aria-label="Cerrar"
        (click)="close()"
      >
        x
      </button>

      <ng-content />
    </section>
  </div>
}
