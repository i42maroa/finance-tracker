@if (modalService.modal$ | async; as modal) {
  <div class="modal-shell">
    <button
      class="modal-backdrop"
      type="button"
      aria-label="Cerrar modal"
      (click)="close()"
    ></button>

    <section
      class="modal-panel"
      role="dialog"
      aria-modal="true"
    >
      <button
        class="modal-close-button"
        type="button"
        aria-label="Cerrar"
        (click)="close()"
      >
        x
      </button>

      @switch (modal.type) {
        @case ('transaction-form') {
          <app-transaction-form-modal [data]="modal.data" />
        }
        @case ('household-create') {
          <app-household-create-modal />
        }
        @case ('household-invite') {
          <app-household-invite-modal [data]="modal.data" />
        }
      }
    </section>
  </div>
}
