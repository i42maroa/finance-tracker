<form class="modal-form" [formGroup]="form" (ngSubmit)="submitTransaction()">
  <header class="form-head">
    <p class="currency">EUR</p>
    <h2 class="form-title">
      {{ data.mode === 'edit' ? 'Editar transaccion' : 'Nueva transaccion' }}
    </h2>
  </header>

  <div class="type-toggle">
    <label
      class="type-option"
      [class.type-active]="form.controls.type.value === 'expense'"
      [class.type-expense]="form.controls.type.value === 'expense'"
    >
      <input class="visually-hidden" type="radio" value="expense" formControlName="type" />
      Gasto
    </label>
    <label
      class="type-option"
      [class.type-active]="form.controls.type.value === 'income'"
      [class.type-income]="form.controls.type.value === 'income'"
    >
      <input class="visually-hidden" type="radio" value="income" formControlName="type" />
      Ingreso
    </label>
  </div>

  <div class="form-grid">
    <label class="field">
      Importe
      <div class="money-field">
        <span class="money-prefix">EUR</span>
        <input
          class="field-control amount-input"
          type="number"
          min="0.01"
          step="0.01"
          inputmode="decimal"
          placeholder="0.00"
          formControlName="amount"
        />
      </div>
    </label>

    <label class="field">
      Fecha
      <input class="field-control" type="date" formControlName="date" />
    </label>

    <label class="field">
      Household
      <select class="field-control" formControlName="householdId">
        <option value="" disabled>Selecciona household</option>
        @for (household of households$ | async; track household.id) {
          <option [value]="household.id">{{ household.name }}</option>
        }
      </select>
    </label>

    <label class="field">
      Categoria
      <input
        class="field-control"
        type="text"
        autocomplete="off"
        placeholder="Comida, nomina..."
        formControlName="category"
      />
    </label>

    <label class="field field-wide">
      Descripcion
      <input
        class="field-control"
        type="text"
        autocomplete="off"
        placeholder="Compra semanal"
        formControlName="description"
      />
    </label>

    <label class="field field-wide">
      Notas
      <textarea
        class="field-control notes-control"
        placeholder="Opcional"
        formControlName="notes"
      ></textarea>
    </label>
  </div>

  @if (errorMessage) {
    <p class="form-error">{{ errorMessage }}</p>
  }

  <div class="form-actions">
    <button class="primary-button" type="submit" [disabled]="isSaving">
      {{ data.mode === 'edit' ? 'Guardar cambios' : 'Crear transaccion' }}
    </button>

    <button class="secondary-button" type="button" (click)="cancelEdit()">
      Cancelar
    </button>
  </div>
</form>
